<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0D3E2F" />
  <title>Offline — Sheikh Admin</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #edf4f0; color: #0f241c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 26rem; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { margin: 16px 0 8px; font-size: 1.4rem; }
    p { margin: 0 0 20px; line-height: 1.55; color: #3d5248; }
    button { font: inherit; font-weight: 600; background: #0d3e2f; color: #fff; border: 0; border-radius: 999px; padding: 12px 28px; cursor: pointer; }
    button:focus-visible { outline: 3px solid #bf9a45; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>You are offline</h1>
    <p>The admin needs a connection to load and save content. Check your network, then try again. Nothing you have already saved is lost.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
