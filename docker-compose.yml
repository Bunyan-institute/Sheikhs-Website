services:
  web:
    build: .
    image: sheikh-ferej:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env          # copy .env.example to .env and fill in the secrets
    volumes:
      - sheikh_data:/app/data   # SQLite database + uploaded files

volumes:
  sheikh_data:
